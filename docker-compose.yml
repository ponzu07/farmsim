version: '3.8'

services:
  app:
    image: node:latest
    container_name: farmsim-dev
    working_dir: /app
    command: sh -c "npm install && tail -f /dev/null"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    tty: true
    stdin_open: true

volumes:
  node_modules: